name: cross-platform

# What `ci` does not cover: the journeys in every browser, and everything on Windows.
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: cross-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  FIXTURE_BUILD_CONCURRENCY: 2

jobs:
  linux-browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    env:
      E2E_BROWSER: ${{ matrix.browser }}
      FIXTURE_BUILD_CONCURRENCY: 4
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter "./packages/**" --filter "!./packages/*/playground" run build
      - run: pnpm run dev:prepare
      - run: pnpm --filter "./packages/*/playground" run build
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm run test:e2e

  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter "./packages/**" --filter "!./packages/*/playground" run build
      - run: pnpm run dev:prepare
      - run: pnpm --filter "./packages/*/playground" run build
      - run: pnpm run test:unit
      - run: pnpm run test:packages

  # One worker with no isolation: on Windows a shared server dies with the fork that started it. Shards keep the heap of
  # that one process in bounds, it passed 4 GB on the whole set.
  windows-browsers:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3]
    env:
      E2E_BROWSER: ${{ matrix.browser }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter "./packages/**" --filter "!./packages/*/playground" run build
      - run: pnpm run dev:prepare
      - run: pnpm --filter "./packages/*/playground" run build
      - run: pnpm exec playwright install ${{ matrix.browser }}
      - run: pnpm exec vitest run --config vitest.e2e.config.ts --maxWorkers=1 --no-isolate --shard=${{ matrix.shard }}/3
