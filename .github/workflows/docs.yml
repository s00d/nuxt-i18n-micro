name: docs

permissions:
  contents: write

on:
  # trigger deployment on every push to main branch, but only if docs folder has changes
  push:
    branches: [main]
    paths:
      - 'docs/**'
  # trigger deployment when a new release is published
  release:
    types: [published]
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # fetch all commits to get last updated time or other git log info
          fetch-depth: 0

      # version comes from `packageManager` in package.json
      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # choose node.js version to use
          node-version: 22
          # cache deps for pnpm
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Prepack
        # `./packages/**` also matches `packages/*/playground` (astro build fails without
        # root `.nuxt/tsconfig.json`). `prepack` already builds `./packages/*` only.
        run: pnpm run prepack

      # run build script
      - name: Build VitePress site
        env:
          NODE_OPTIONS: --max_old_space_size=8192
        run: pnpm run docs:build

      - name: Add nojekyll
        run: |-
          > docs/.vitepress/dist/.nojekyll

      # please check out the docs of the workflow for more details
      # @see https://github.com/crazy-max/ghaction-github-pages
      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v4
        with:
          # deploy to gh-pages branch
          target_branch: gh-pages
          # the default output dir of VitePress
          build_dir: docs/.vitepress/dist
        env:
          # @see https://docs.github.com/en/actions/reference/authentication-in-a-workflow#about-the-github_token-secret
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
