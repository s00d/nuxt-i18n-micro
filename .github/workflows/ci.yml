name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm run lint

  # Package tests + unit/build tests in one job. Unit files run serially on CI
  # (fileParallelism disabled) because they spawn heavy subprocesses (nuxi build,
  # headless Chromium) that OOM a runner when parallel.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter "./packages/**" run build
      - run: pnpm run dev:prepare
      # unit suite includes browser-backed generate tests (chromium.launch())
      - run: pnpm exec playwright install chromium
      - run: pnpm run test:packages
      - run: pnpm run test:unit

  # Browser e2e: shared fixtures are built once (globalSetup) and served; specs
  # run against them. Not sharded — sharding would rebuild every fixture per shard.
  e2e:
    runs-on: ubuntu-latest
    env:
      # Serialize shared-fixture builds so a constrained runner does not OOM.
      FIXTURE_BUILD_CONCURRENCY: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: |
            test/fixtures/**/.output-shared
            test/fixtures/**/.build-hash
          key: e2e-shared-${{ runner.os }}-${{ hashFiles('test/fixtures/**', 'src/**', 'packages/**/dist/**', 'pnpm-lock.yaml') }}
          restore-keys: |
            e2e-shared-${{ runner.os }}-
      - run: pnpm install
      - run: pnpm --filter "./packages/**" run build
      - run: pnpm run dev:prepare
      - run: pnpm exec playwright install chromium
      - run: pnpm run test:e2e

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter "./packages/**" run build
      - run: pnpm run dev:prepare
      - run: pnpm verify:packages && pnpm verify:packages:publint
      - run: pnpm run test:dist:packages
      - run: pnpm run compare:published
