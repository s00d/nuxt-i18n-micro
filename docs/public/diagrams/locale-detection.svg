<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif">
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#93a5a0"/></marker></defs>
<rect width="960" height="520" rx="14" fill="#0c1211"/><rect x="380" y="24" width="200" height="52" rx="10" fill="#141c1a" stroke="#2c3b36"/><text x="480" y="56" text-anchor="middle" font-size="18" font-weight="600" fill="#e8f0ed">Request</text><path d="M480 76 L480 112" fill="none" stroke="#93a5a0" stroke-width="1.4" marker-end="url(#head)"/><rect x="340" y="112" width="280" height="52" rx="10" fill="#10261f" stroke="#1f9b72"/><text x="480" y="144" text-anchor="middle" font-size="18" font-weight="600" fill="#e8f0ed">Locale prefix in the URL?</text><path d="M340 138 L176 138 L176 196" fill="none" stroke="#93a5a0" stroke-width="1.4" marker-end="url(#head)"/><text x="262" y="130" font-size="14.5" fill="#5fe0ae" text-anchor="middle">yes</text><rect x="60" y="196" width="232" height="52" rx="10" fill="#141c1a" stroke="#2c3b36"/><text x="176" y="228" text-anchor="middle" font-size="18" font-weight="600" fill="#e8f0ed">Render that locale</text><path d="M480 164 L480 196" fill="none" stroke="#93a5a0" stroke-width="1.4" marker-end="url(#head)"/><text x="498" y="184" font-size="14.5" fill="#5fe0ae" text-anchor="middle">no</text><rect x="380" y="196" width="200" height="52" rx="10" fill="#10261f" stroke="#1f9b72"/><text x="480" y="228" text-anchor="middle" font-size="18" font-weight="600" fill="#e8f0ed">Which strategy?</text><path d="M380 222 L330 222 L330 288 L176 288 L176 312" fill="none" stroke="#93a5a0" stroke-width="1.4" marker-end="url(#head)"/><text x="254" y="280" font-size="14.5" fill="#5fe0ae" text-anchor="middle">no_prefix</text><rect x="36" y="312" width="280" height="84" rx="10" fill="#141c1a" stroke="#2c3b36"/><text x="176" y="337" text-anchor="middle" font-size="18" font-weight="600" fill="#e8f0ed">Render</text><text x="176" y="360" text-anchor="middle" font-size="15" fill="#93a5a0">?locale → state → cookie</text><text x="176" y="383" text-anchor="middle" font-size="15" fill="#93a5a0">→ Accept-Language → default</text><path d="M480 248 L480 312" fill="none" stroke="#93a5a0" stroke-width="1.4" marker-end="url(#head)"/><text x="480" y="284" font-size="14.5" fill="#5fe0ae" text-anchor="middle">prefix_and_default</text><rect x="356" y="312" width="248" height="84" rx="10" fill="#141c1a" stroke="#2c3b36"/><text x="480" y="348.5" text-anchor="middle" font-size="18" font-weight="600" fill="#e8f0ed">Render the default locale</text><text x="480" y="371.5" text-anchor="middle" font-size="15" fill="#93a5a0">no redirect</text><path d="M580 222 L784 222 L784 288" fill="none" stroke="#93a5a0" stroke-width="1.4" marker-end="url(#head)"/><text x="690" y="212" font-size="14.5" fill="#5fe0ae" text-anchor="middle">prefix, prefix_except_default</text><rect x="610" y="288" width="326" height="52" rx="10" fill="#10261f" stroke="#1f9b72"/><text x="773" y="320" text-anchor="middle" font-size="18" font-weight="600" fill="#e8f0ed">autoDetectPath allows this path?</text><path d="M720 340 L720 396 L640 396 L640 420" fill="none" stroke="#93a5a0" stroke-width="1.4" marker-end="url(#head)"/><text x="700" y="372" font-size="14.5" fill="#5fe0ae" text-anchor="middle">yes</text><rect x="476" y="420" width="268" height="76" rx="10" fill="#141c1a" stroke="#2c3b36"/><text x="610" y="441" text-anchor="middle" font-size="18" font-weight="600" fill="#e8f0ed">Redirect to</text><text x="610" y="464" text-anchor="middle" font-size="15" fill="#93a5a0">state → cookie</text><text x="610" y="487" text-anchor="middle" font-size="15" fill="#93a5a0">→ Accept-Language → default</text><path d="M850 340 L850 420" fill="none" stroke="#93a5a0" stroke-width="1.4" marker-end="url(#head)"/><text x="866" y="384" font-size="14.5" fill="#5fe0ae" text-anchor="middle">no</text><rect x="764" y="420" width="172" height="76" rx="10" fill="#141c1a" stroke="#2c3b36"/><text x="850" y="441" text-anchor="middle" font-size="18" font-weight="600" fill="#e8f0ed">Path not allowed</text><text x="850" y="464" text-anchor="middle" font-size="15" fill="#93a5a0">prefix: by preference</text><text x="850" y="487" text-anchor="middle" font-size="15" fill="#93a5a0">else: default locale</text></svg>
