name: cross-platform

# What `ci` does not cover: the journeys in every browser, and everything on Windows.
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: cross-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FIXTURE_BUILD_CONCURRENCY: 4
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter "./packages/**" --filter "!./packages/*/playground" run build
      - run: pnpm run dev:prepare
      - run: pnpm --filter "./packages/*/playground" run build
      - run: pnpm exec playwright install --with-deps firefox webkit
      - name: Journeys, Firefox and WebKit
        run: |
          rc=0
          for browser in firefox webkit; do
            echo "::group::${browser}"
            E2E_BROWSER=$browser pnpm run test:e2e || rc=1
            echo "::endgroup::"
          done
          exit $rc

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      FIXTURE_BUILD_CONCURRENCY: 2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter "./packages/**" --filter "!./packages/*/playground" run build
      - run: pnpm run dev:prepare
      - run: pnpm --filter "./packages/*/playground" run build
      - run: pnpm run test:unit
      - run: pnpm run test:packages
      - run: pnpm exec playwright install chromium firefox webkit
      # One worker with no isolation: on Windows a shared server dies with the fork that started it. Shards keep the heap of
      # that one process in bounds, it passed 4 GB on the whole set.
      - name: Journeys, every browser
        run: |
          rc=0
          for browser in chromium firefox webkit; do
            for shard in 1 2 3; do
              echo "::group::${browser} ${shard}/3"
              E2E_BROWSER=$browser pnpm exec vitest run --config vitest.e2e.config.ts --maxWorkers=1 --no-isolate --shard=${shard}/3 || rc=1
              echo "::endgroup::"
            done
          done
          exit $rc
