name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm run lint

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter "./packages/**" run build
      - run: pnpm run test:workspaces

  node-e2e:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter "./packages/**" run build
      - run: pnpm run dev:prepare
      - run: pnpm exec vitest run --shard=${{ matrix.shard }}/2

  e2e:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: |
            test/fixtures/**/.output-shared
            test/fixtures/**/.build-hash
          key: playwright-shared-${{ runner.os }}-${{ hashFiles('test/fixtures/**', 'src/**', 'packages/**/dist/**', 'pnpm-lock.yaml') }}
          restore-keys: |
            playwright-shared-${{ runner.os }}-
      - run: pnpm install
      - run: pnpm --filter "./packages/**" run build
      - run: pnpm run dev:prepare
      - run: pnpm exec playwright install chromium
      - run: pnpm exec playwright test --shard=${{ matrix.shard }}/4

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter "./packages/**" run build
      - run: pnpm run dev:prepare
      - run: pnpm verify:packages && pnpm verify:packages:publint
      - run: pnpm run test:dist:packages
