name: docs

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Prepack
        # `./packages/**` also matches `packages/*/playground` (astro build fails without
        # root `.nuxt/tsconfig.json`). `prepack` already builds `./packages/*` only.
        run: pnpm run prepack

      - name: Build docs (Nuxt generate)
        env:
          NODE_OPTIONS: --max_old_space_size=8192
        run: pnpm run docs:build

      - name: Add nojekyll
        run: |-
          > docs/.output/public/.nojekyll

      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: gh-pages
          build_dir: docs/.output/public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
