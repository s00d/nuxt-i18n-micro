name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# One job: install/build/prepare once, then run everything sequentially.
# Avoids paying for duplicated setup across parallel jobs.
jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Serialize shared-fixture builds so the runner does not OOM.
      FIXTURE_BUILD_CONCURRENCY: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: |
            test/fixtures/**/.output-shared
            test/fixtures/**/.build-hash
          key: e2e-shared-${{ runner.os }}-${{ hashFiles('test/fixtures/**', 'src/**', 'packages/**/dist/**', 'pnpm-lock.yaml') }}
          restore-keys: |
            e2e-shared-${{ runner.os }}-

      - run: pnpm install
      # Extra swap: unit tests spawn nuxi build/generate right after test:packages
      # and constrained runners otherwise OOM-kill the Vitest worker (ERR_IPC_CHANNEL_CLOSED).
      - name: Add swap for heavy test steps
        run: |
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
      - run: pnpm run lint
      - run: pnpm --filter "./packages/**" run build
      - run: pnpm run dev:prepare
      # unit + e2e both drive a real browser (chromium.launch / createPage)
      - run: pnpm exec playwright install chromium

      - run: pnpm run test:packages
      - run: pnpm run test:unit
      - run: pnpm run test:e2e

      - run: pnpm verify:packages && pnpm verify:packages:publint
      - run: pnpm run test:dist:packages
      - run: pnpm run compare:published
