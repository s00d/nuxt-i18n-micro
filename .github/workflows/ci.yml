name: ci

on:
  push:
    branches:
      - main
  # every PR, whatever its base (stacked PRs target the previous branch, not main)
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]

# Single workflow: soft checks continue after failure, Job Summary + sticky
# PR comments (diff audit + CI report). Cleanup sticky comments on PR close.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  CI: true
  CI_SUMMARY_MAX_LINES: '40'
  CI_SUMMARY_MAX_CHARS: '8000'
  CI_SUMMARY_MAX_TOTAL_CHARS: '28000'

jobs:
  # Each group runs on its own runner (free on a public repository); `ci` gathers their logs and
  # outcomes into the Job Summary and the sticky PR comment. Soft checks keep `continue-on-error`,
  # so every group reports all of its checks; a group that cannot even prepare fails `ci` too.
  checks:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    # `cmd | tee log` must fail the step when cmd fails (bash default uses tee's 0).
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: check:versions diffs against the PR merge-base / last tag.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # also the log dir every check below writes to
      - uses: ./.github/actions/prepare

      - name: PR diff comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"
          git diff --numstat "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-numstat.txt"
          git diff --name-status "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-name-status.txt"

          MARKER='pr-diff-audit:v1'
          BOT='github-actions[bot]'
          existing_body="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --jq ".[] | select(.user.login == \"$BOT\" and (.body | contains(\"$MARKER\"))) | .body" \
              | head -n 1
          )"
          # `pnpm run cli` prints lifecycle banners to stdout — never capture that into
          # sticky comment bodies / --id. Call tsx directly.
          scripts_cli() { pnpm -C scripts exec tsx ./src/run.ts "$@"; }

          AUDIT_ID="$(printf '%s' "$existing_body" | scripts_cli pr-diff-audit extract-id || true)"
          if [ -z "${AUDIT_ID}" ]; then
            AUDIT_ID="$(scripts_cli pr-diff-audit new-id)"
          fi

          scripts_cli pr-diff-audit body \
            --files "$RUNNER_TEMP/changed-files.txt" \
            --numstat "$RUNNER_TEMP/changed-numstat.txt" \
            --nameStatus "$RUNNER_TEMP/changed-name-status.txt" \
            --id="$AUDIT_ID" \
            --pr="$PR_NUMBER" \
            --headSha="$HEAD_SHA" \
            > "$RUNNER_TEMP/pr-diff-comment.md"

          existing_id="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --jq ".[] | select(.user.login == \"$BOT\" and (.body | contains(\"$MARKER\"))) | .id" \
              | head -n 1
          )"
          if [ -n "${existing_id}" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing_id}" \
              -F body=@"$RUNNER_TEMP/pr-diff-comment.md" >/dev/null
            echo "Updated PR diff comment ${existing_id}"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -F body=@"$RUNNER_TEMP/pr-diff-comment.md" >/dev/null
            echo "Created PR diff comment"
          fi

      # Packages in packages/* are versioned by hand and `pnpm publish -r` silently
      # skips a version that already exists on npm — so a forgotten bump ships a
      # stale package. Fail here instead. Cheap (git, plus one npm lookup only for a
      # changed package whose version was not bumped), so it runs early.
      - name: Check versions
        id: versions
        continue-on-error: true
        run: |
          set +e
          # PRs compare with main, not the PR base: a stacked PR's base is the previous step, and
          # every step would need a new bump of every dependent. The command reads this variable;
          # on a push it is empty and the baseline stays the last tag. --npm rejects published versions.
          if [ -n "$GITHUB_BASE_REF" ]; then export GITHUB_BASE_REF=main; fi
          pnpm run check:versions -- --npm 2>&1 | tee "$CI_LOG_DIR/versions.log"
          exit "${PIPESTATUS[0]}"

      # Memory headroom on the runner, for the record: ubuntu-latest gives
      # 4 vCPU / 15 GiB with ~14 GiB free and ~4 GiB of swap already configured.
      # The previous ERR_IPC_CHANNEL_CLOSED crashes were tests killing processes
      # by port (lsof + SIGKILL), not memory — so no extra swap is provisioned.
      # If a step ever does run out of memory, print `free -h` here first to
      # confirm it before adding any.
      # `release:*` runs format:check before publishing: an unformatted file stops the release
      - name: Lint and format
        id: lint
        continue-on-error: true
        run: |
          set +e
          pnpm run lint 2>&1 | tee "$CI_LOG_DIR/lint.log"
          lint="${PIPESTATUS[0]}"
          pnpm run format:check 2>&1 | tee -a "$CI_LOG_DIR/lint.log"
          format="${PIPESTATUS[0]}"
          exit $(( lint || format ))

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: |
          set +e
          # type tests of test/ run here, not in "Test unit", so test counts are runtime tests only
          # both run even if the first fails, so one failure does not hide the other
          { pnpm run typecheck; a=$?; pnpm run test:unit:types; b=$?; exit $((a || b)); } 2>&1 | tee "$CI_LOG_DIR/typecheck.log"
          exit "${PIPESTATUS[0]}"

      - name: Verify packages
        id: verify-packages
        continue-on-error: true
        run: |
          set +e
          { pnpm verify:packages && pnpm verify:packages:publint; } 2>&1 | tee "$CI_LOG_DIR/verify-packages.log"
          exit "${PIPESTATUS[0]}"

      # --local-only keeps both packaging gates (hashed chunks, astro client CJS),
      # which are computed from the local pack, and skips the npm reference
      # download that only feeds informational diffs. Full comparison runs on release.
      - name: Compare published
        id: compare-published
        continue-on-error: true
        run: |
          set +e
          pnpm run compare:published -- --local-only --changed-only 2>&1 | tee "$CI_LOG_DIR/compare-published.log"
          exit "${PIPESTATUS[0]}"

      # Reads the tarballs as a user does; the repository's own builds set skipLibCheck: true.
      # The root needs a real build for this, so it replaces the dev stub: keep this step last.
      - name: Consumer types
        id: consumer-types
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set +e
          { pnpm exec nuxt-module-build build && pnpm run check:consumer; } 2>&1 | tee "$CI_LOG_DIR/consumer-types.log"
          exit "${PIPESTATUS[0]}"

      - name: Record outcomes
        if: always()
        run: |
          d="${RUNNER_TEMP}/ci-logs/outcomes"; mkdir -p "$d"
          echo "${{ steps.versions.outcome }}" > "$d/VERSIONS_OUTCOME.checks"
          echo "${{ steps.lint.outcome }}" > "$d/LINT_OUTCOME.checks"
          echo "${{ steps.typecheck.outcome }}" > "$d/TYPECHECK_OUTCOME.checks"
          echo "${{ steps.verify-packages.outcome }}" > "$d/VERIFY_PACKAGES_OUTCOME.checks"
          echo "${{ steps.compare-published.outcome }}" > "$d/COMPARE_PUBLISHED_OUTCOME.checks"
          echo "${{ steps.consumer-types.outcome }}" > "$d/CONSUMER_TYPES_OUTCOME.checks"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-logs-checks
          path: ${{ runner.temp }}/ci-logs
          include-hidden-files: true

  tests:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        suite: [packages, unit, integration]
    env:
      FIXTURE_BUILD_CONCURRENCY: ${{ matrix.os == 'windows-latest' && 2 || 4 }}
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - uses: actions/checkout@v7
        with:
          # scripts' tests read git history (baselines, merge-base)
          fetch-depth: 0
      - uses: actions/cache@v6
        if: matrix.suite == 'integration'
        with:
          # builds only: the run registry and locks (test/.untestutils/run) are per run
          path: |
            test/.untestutils/builds
          # Source-only globs: broad test/fixtures/** also matches .output-shared
          # after e2e and hashFiles fails when saving the cache at job end.
          key: e2e-shared-${{ runner.os }}-${{ hashFiles('test/recipes.ts', 'vitest.e2e.config.ts', 'test/fixtures/**/nuxt.config.ts', 'test/fixtures/**/package.json', 'test/fixtures/**/app.vue', 'test/fixtures/**/app/**', 'test/fixtures/**/pages/**', 'test/fixtures/**/components/**', 'test/fixtures/**/locales/**', 'test/fixtures/**/server/**', 'test/fixtures/**/modules/**', 'test/fixtures/**/content.config.ts', 'test/fixtures/**/content/**', 'test/fixtures/**/layers/**', 'test/fixtures/**/middleware/**', 'test/fixtures/**/plugins/**', 'test/fixtures/**/layouts/**', 'test/fixtures/**/composables/**', 'test/fixtures/**/public/**', 'test/fixtures/**/data/**', 'src/**', 'packages/**/src/**', 'packages/**/package.json', 'pnpm-lock.yaml', 'package.json') }}
          restore-keys: |
            e2e-shared-${{ runner.os }}-

      - uses: ./.github/actions/setup
      - uses: ./.github/actions/prepare

      # integration drives a real browser (chromium.launch / createPage)
      - if: matrix.suite == 'integration'
        run: pnpm exec playwright install ${{ runner.os == 'Linux' && '--with-deps chromium' || 'chromium' }}

      - name: Test packages
        id: test-packages
        if: matrix.suite == 'packages'
        continue-on-error: true
        run: |
          set +e
          pnpm run test:packages 2>&1 | tee "$CI_LOG_DIR/test-packages.log"
          exit "${PIPESTATUS[0]}"

      - name: Test unit
        id: test-unit
        if: matrix.suite == 'unit'
        continue-on-error: true
        run: |
          set +e
          pnpm run test:unit --typecheck.enabled=false 2>&1 | tee "$CI_LOG_DIR/test-unit.log"
          exit "${PIPESTATUS[0]}"

      - name: Test dist packages
        id: test-dist
        if: matrix.suite == 'unit'
        continue-on-error: true
        run: |
          set +e
          pnpm run test:dist:packages 2>&1 | tee "$CI_LOG_DIR/test-dist.log"
          exit "${PIPESTATUS[0]}"

      - name: Test integration
        id: test-integration
        if: matrix.suite == 'integration'
        continue-on-error: true
        run: |
          set +e
          pnpm run test:integration 2>&1 | tee "$CI_LOG_DIR/test-integration.log"
          exit "${PIPESTATUS[0]}"

      - name: Record outcomes
        if: always()
        run: |
          d="${RUNNER_TEMP}/ci-logs/outcomes"; mkdir -p "$d"; tag="${{ matrix.os }}-${{ matrix.suite }}"
          echo "${{ steps.test-packages.outcome }}" > "$d/TEST_PACKAGES_OUTCOME.$tag"
          echo "${{ steps.test-unit.outcome }}" > "$d/TEST_UNIT_OUTCOME.$tag"
          echo "${{ steps.test-dist.outcome }}" > "$d/TEST_DIST_OUTCOME.$tag"
          echo "${{ steps.test-integration.outcome }}" > "$d/TEST_INTEGRATION_OUTCOME.$tag"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-logs-tests-${{ matrix.os }}-${{ matrix.suite }}
          path: ${{ runner.temp }}/ci-logs
          include-hidden-files: true

  e2e:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The three engines on Linux. Windows is there for paths, builds and files: Chromium only.
          - { os: ubuntu-latest, browser: chromium, shard: 1, shards: 1 }
          - { os: ubuntu-latest, browser: firefox, shard: 1, shards: 1 }
          - { os: ubuntu-latest, browser: webkit, shard: 1, shards: 1 }
          - { os: windows-latest, browser: chromium, shard: 1, shards: 3 }
          - { os: windows-latest, browser: chromium, shard: 2, shards: 3 }
          - { os: windows-latest, browser: chromium, shard: 3, shards: 3 }
    env:
      FIXTURE_BUILD_CONCURRENCY: ${{ matrix.os == 'windows-latest' && 2 || 4 }}
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          # builds only: the run registry and locks (test/.untestutils/run) are per run
          path: |
            test/.untestutils/builds
          # Source-only globs: broad test/fixtures/** also matches .output-shared
          # after e2e and hashFiles fails when saving the cache at job end.
          key: e2e-shared-${{ runner.os }}-${{ hashFiles('test/recipes.ts', 'vitest.e2e.config.ts', 'test/fixtures/**/nuxt.config.ts', 'test/fixtures/**/package.json', 'test/fixtures/**/app.vue', 'test/fixtures/**/app/**', 'test/fixtures/**/pages/**', 'test/fixtures/**/components/**', 'test/fixtures/**/locales/**', 'test/fixtures/**/server/**', 'test/fixtures/**/modules/**', 'test/fixtures/**/content.config.ts', 'test/fixtures/**/content/**', 'test/fixtures/**/layers/**', 'test/fixtures/**/middleware/**', 'test/fixtures/**/plugins/**', 'test/fixtures/**/layouts/**', 'test/fixtures/**/composables/**', 'test/fixtures/**/public/**', 'test/fixtures/**/data/**', 'src/**', 'packages/**/src/**', 'packages/**/package.json', 'pnpm-lock.yaml', 'package.json') }}
          restore-keys: |
            e2e-shared-${{ runner.os }}-

      - uses: ./.github/actions/setup
      - uses: ./.github/actions/prepare
      - run: pnpm exec playwright install ${{ runner.os == 'Linux' && format('--with-deps {0}', matrix.browser) || matrix.browser }}

      - name: Test e2e
        id: test-e2e
        continue-on-error: true
        env:
          E2E_BROWSER: ${{ matrix.browser }}
        run: |
          set +e
          if [ "$RUNNER_OS" != Windows ]; then
            pnpm exec vitest run --config vitest.e2e.config.ts 2>&1 | tee "$CI_LOG_DIR/test-e2e.log"
            exit "${PIPESTATUS[0]}"
          fi
          # One worker with no isolation: on Windows a shared server dies with the fork that started it. Shards keep the
          # heap of that one process in bounds, it passed 4 GB on the whole set. The retry is for the runner: a socket out of
          # buffers (`ERR_NO_BUFFER_SPACE`), an aborted manifest fetch. Each hit one test in 552, never the same one.
          pnpm exec vitest run --config vitest.e2e.config.ts --maxWorkers=1 --no-isolate --retry=1 --shard=${{ matrix.shard }}/${{ matrix.shards }} 2>&1 | tee "$CI_LOG_DIR/test-e2e.log"
          exit "${PIPESTATUS[0]}"

      - name: Record outcomes
        if: always()
        run: |
          d="${RUNNER_TEMP}/ci-logs/outcomes"; mkdir -p "$d"
          echo "${{ steps.test-e2e.outcome }}" > "$d/TEST_E2E_OUTCOME.${{ matrix.os }}-${{ matrix.browser }}-${{ matrix.shard }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-logs-e2e-${{ matrix.os }}-${{ matrix.browser }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/ci-logs
          include-hidden-files: true

  # The one job `publish --ci-passed` reads (`TEST_JOB = 'ci'`): green only when every group passed.
  ci:
    if: always() && (github.event_name != 'pull_request' || github.event.action != 'closed')
    needs: [checks, tests, e2e]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          pattern: ci-logs-*
          path: ${{ runner.temp }}/artifacts

      # One log per check (a check that ran on several runners gets each part under a header), one outcome per check:
      # any failure wins, then success; a check no runner reached stays skipped.
      - name: Merge logs and outcomes
        env:
          NEEDS_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          log_dir="${RUNNER_TEMP}/ci-logs"
          mkdir -p "$log_dir"
          echo "CI_LOG_DIR=$log_dir" >> "$GITHUB_ENV"
          for dir in "${RUNNER_TEMP}"/artifacts/*/; do
            part="$(basename "$dir")"
            for file in "$dir"*.log; do
              [ -e "$file" ] || continue
              { echo "== ${part#ci-logs-}"; cat "$file"; } >> "$log_dir/$(basename "$file")"
            done
          done
          for check in VERSIONS LINT TYPECHECK TEST_PACKAGES TEST_UNIT TEST_INTEGRATION TEST_E2E VERIFY_PACKAGES TEST_DIST COMPARE_PUBLISHED CONSUMER_TYPES; do
            values="$(cat "${RUNNER_TEMP}"/artifacts/*/outcomes/"${check}_OUTCOME".* 2>/dev/null | grep -v '^$' | sort -u || true)"
            if [ -z "$values" ]; then outcome=skipped
            elif grep -qvE '^(success|skipped)$' <<<"$values"; then outcome=failure
            elif grep -q '^success$' <<<"$values"; then outcome=success
            else outcome=skipped; fi
            echo "${check}_OUTCOME=$outcome" >> "$GITHUB_ENV"
          done
          echo "Groups: $NEEDS_RESULTS"

      - name: CI summary
        run: |
          set +e
          out="$(mktemp)"
          # tsx direct: avoid pnpm run banners in Job Summary markdown
          pnpm -C scripts exec tsx ./src/run.ts ci-pr-report summary >"$out"
          code=$?
          set -e
          cat "$out"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat "$out" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GITHUB_STEP_SUMMARY is unset; Job Summary tab will be empty"
          fi
          exit "$code"

      - name: CI PR comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm -C scripts exec tsx ./src/run.ts ci-pr-report comment

      # A group that failed outside its soft checks (install, build, a cancelled runner) reported nothing for them.
      - name: Every group finished
        if: always()
        env:
          NEEDS_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $NEEDS_RESULTS; do
            [ "$result" = success ] || { echo "::error::a CI group ended with '$result': see its job log"; exit 1; }
          done

  # Same workflow file: drop sticky comments when the PR is closed/merged.
  cleanup-sticky:
    if: >
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete sticky PR comments
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          BOT='github-actions[bot]'
          for MARKER in 'pr-diff-audit:v1' 'pr-checks-ci'; do
            ids="$(
              gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
                --jq ".[] | select(.user.login == \"$BOT\" and (.body | contains(\"$MARKER\"))) | .id"
            )"
            if [ -z "${ids}" ]; then
              echo "No comment for marker ${MARKER}"
              continue
            fi
            for id in $ids; do
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${id}"
              echo "Deleted comment ${id} (${MARKER})"
            done
          done
